<h1>ギャラリーを石の種類で絞り込めるようになりました</h1>
<p>ギャラリーに、石の種類で作品を絞り込める機能を追加しました。</p>
<p>一覧の上にある「石の種類で絞り込む」から、サファイアやジルコン、ガーネットなどを選ぶと、その種類の作品だけが表示されます。ページをまたいだすべての掲載作品から探せます。</p>
<p>「すべての石の種類」を選ぶと、通常の一覧表示に戻ります。</p>
<p>お好きな石の作品を、ゆっくりご覧いただけたらうれしいです。</p>
<p><a href="/gallery/">ギャラリーを見る →</a></p>
