<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rara Lab</title>
    <link rel="stylesheet" href="/assets/css/site.css">
  </head>
  <body>
    <header class="site-hero">
      <div class="site-hero-logo">
        <img
          src="/assets/images/top/raralab-logo-l.png"
          alt="Rara Lab ロゴ"
        >
      </div>

      <figure class="site-hero-image">
        <img
          src="/assets/images/top/hero.jpg"
          alt="スケッチブックの上で選別しているモンタナサファイアの原石と完成石"
        >
      </figure>

      <section class="site-hero-intro">
        <p>
          Rara Lab（ララ・ラボ）は、宝石を研磨する小さな工房です。
        </p>
        <p>
          原石に合わせて、小さなファセットをひとつずつ積み重ねています。
        </p>
      </section>
    </header>

    <main class="site-main">
      <section class="site-notice">
        <p>
          現在サイトをリニューアル中です。ギャラリーと記事は、準備ができた部分から順次公開していきます。
        </p>
      </section>
    </main>
  </body>
</html>
