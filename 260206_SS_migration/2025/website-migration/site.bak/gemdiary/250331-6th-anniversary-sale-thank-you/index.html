<div class="sqs-html-content" data-sqsp-text-block-content>
  <p class="" style="white-space:pre-wrap;">本日をもちまして、6周年記念セールを終了いたしました。<br>たくさんのご注文、そしてご覧いただき、本当にありがとうございました。</p><p class="" style="white-space:pre-wrap;">初めてご購入くださった方、何度も見に来てくださっている方、記事や投稿を読んでくださった方 ──  どの関わり方もとても嬉しくて、毎日あたたかい気持ちで過ごすことができました。</p><p class="" style="white-space:pre-wrap;">石を見て楽しんでくださる方が少しずつ増えていること、心からありがたく思っています。</p><p class="" style="white-space:pre-wrap;">これから少しのあいだ、制作に集中する期間となりますが、また新しい石をお届けできるよう、ひとつひとつ丁寧に研磨していきます。</p><p class="" style="white-space:pre-wrap;">今後とも、どうぞよろしくお願いいたします。</p>
